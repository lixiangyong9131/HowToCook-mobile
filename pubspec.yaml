name: how_to_cook
description: 程序员做饭指南移动端 — 离线菜谱，致敬 Anduin2017/HowToCook
publish_to: 'none'
version: 0.6.40+48

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7+1
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  http: ^1.4.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  path: ^1.9.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.23.0
  audioplayers: ^6.7.1
  wakelock_plus: ^1.3.3
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipes_db.json
    - assets/tips_db.json
    - assets/process_images_index.json
    - assets/HOWTOCOOK_LICENSE
    - assets/branding/app_icon_512.png
    - assets/icons/doodle/
    - assets/process_images/
    - assets/sounds/
